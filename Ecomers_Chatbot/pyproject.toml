[project]
name = "ecomers-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = 'IPSOSGROUP\Diganta.Ray', email = "diganta.ray@ipsos.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.12.4",
    "pydantic>=2.13.5",
    "pypdf>=6.18.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "streamlit>=1.63.0",
]

[project.scripts]
ecomers-chatbot = "ecomers_chatbot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
